services:

    # App de base de datos:
  db:
    image: mariadb:11
    container_name: sms-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: school_sys
      MARIADB_USER: adan
      MARIADB_PASSWORD: kernelripper
    volumes:
      # Datos persistentes entre reinicios
      - db_data:/var/lib/mysql
    networks:
      - sms-network
    healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 30s

  # ── 2. Backend Django + Gunicorn ─────────────────────────────────────────────
  backend:
    build:
      context: ./school_sys/   # <- tu repo del backend
      dockerfile: Dockerfile
    container_name: sms-backend
    restart: unless-stopped
    env_file:
    - ./school_sys/.env
    environment:
        DB_HOST: db
        # DEBUG: "True"
        # ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
        DJANGO_SETTINGS_MODULE: school_sys.settings
        # Cambia esto en producción real, nunca dejes DEBUG=True con datos reales
        DEBUG: "True"
        ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
    volumes:
      # Para que Nginx sirva los staticfiles del admin de Django
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sms-network
    # Gunicorn NO expone puerto al host, solo lo ve Nginx internamente

  # ── 3. Nginx + Frontend React ────────────────────────────────────────────────
  nginx:
    build:
      context: .   # <- tu repo del frontend
      dockerfile: nginx/Dockerfile
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP — Cloudflare/túnel apunta aquí
    volumes:
      # Staticfiles de Django admin (generados por collectstatic en backend)
      - static_files:/app/staticfiles:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sms-network

volumes:
  db_data:
  static_files:

networks:
  sms-network:
    driver: bridge
